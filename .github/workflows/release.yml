name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to package
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then tag="${INPUT_TAG}"; fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "invalid stable release tag: $tag" >&2; exit 1; fi
          git rev-parse "$tag^{commit}" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  test:
    needs: validate
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 ./...
      - run: go vet ./...
      - name: Build and smoke-test native binary
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          ext=""
          if [[ "${{ runner.os }}" == Windows ]]; then ext=.exe; fi
          go build -trimpath \
            -ldflags "-X github.com/benice2me11/codexify-go/internal/buildinfo.Version=${VERSION}" \
            -o "codexify-go${ext}" ./cmd/codexify-go
          reported=$("./codexify-go${ext}" version)
          [[ "$reported" == "$VERSION" ]] || { echo "version mismatch: got=$reported want=$VERSION" >&2; exit 1; }

  build:
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          GOOS_TARGET: ${{ matrix.goos }}
          GOARCH_TARGET: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist/package
          ext=""
          if [[ "$GOOS_TARGET" == windows ]]; then ext=.exe; fi
          binary="codexify-go${ext}"
          CGO_ENABLED=0 GOOS="$GOOS_TARGET" GOARCH="$GOARCH_TARGET" \
            go build -trimpath \
              -ldflags "-s -w -X github.com/benice2me11/codexify-go/internal/buildinfo.Version=${VERSION}" \
              -o "dist/package/$binary" ./cmd/codexify-go
          if [[ "$GOOS_TARGET" == windows ]]; then
            archive="codexify-go-v${VERSION}-${GOOS_TARGET}-${GOARCH_TARGET}.zip"
            (cd dist/package && zip -9 "../$archive" "$binary")
          else
            archive="codexify-go-v${VERSION}-${GOOS_TARGET}-${GOARCH_TARGET}.tar.gz"
            (cd dist/package && tar -czf "../$archive" "$binary")
            # Older Unix updaters request ZIP from releases/latest. Keep a ZIP
            # compatibility asset while tar.gz remains the preferred format.
            legacy_archive="codexify-go-v${VERSION}-${GOOS_TARGET}-${GOARCH_TARGET}.zip"
            (cd dist/package && zip -9 "../$legacy_archive" "$binary")
            (cd dist && sha256sum "$legacy_archive" > "$legacy_archive.sha256")
          fi
          (cd dist && sha256sum "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Build checksums.txt
        shell: bash
        run: |
          set -euo pipefail
          cat dist/*.sha256 | sort -k2 > dist/checksums.txt
          rm dist/*.sha256
          cat dist/checksums.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
