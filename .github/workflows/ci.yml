name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 ./...
      - run: go vet ./...
      - name: Build native binary
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [[ "${{ runner.os }}" == Windows ]]; then ext=.exe; fi
          go build -trimpath -o "codexify-go${ext}" ./cmd/codexify-go
          "./codexify-go${ext}" version

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 ./...

  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-build
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [[ "${{ matrix.goos }}" == windows ]]; then ext=.exe; fi
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -o "codexify-go${ext}" ./cmd/codexify-go

  required:
    name: required
    if: always()
    needs: [test, race, cross-build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          RACE_RESULT: ${{ needs.race.result }}
          CROSS_BUILD_RESULT: ${{ needs.cross-build.result }}
        run: |
          set -euo pipefail
          [[ "$TEST_RESULT" == success ]]
          [[ "$RACE_RESULT" == success ]]
          [[ "$CROSS_BUILD_RESULT" == success ]]
