name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 ./...
      - run: go vet ./...
      - name: G10 offline runtime inspection fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/windows/cutover-v2/Test-G10RuntimeInspection.ps1
      - name: Go-only upgrade policy and rollback safety fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/windows/cutover-v2/Test-GoOnlyUpgrade.ps1
      - name: Independent Go-only trial transaction policy and syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/windows/cutover-v2/Test-GoOnlyTrialTransaction.ps1
      - name: Project Groups G10 readiness guard offline fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/windows/cutover-v2/Test-ProjectGroupsCanaryReadiness.ps1
      - name: G11 steady-state supervision policy, offline monitor and AST
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/windows/g11/Test-G11SteadyState.ps1
      - name: G11 normal-profile independent cutover safety fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/windows/g11/Test-G11NormalProfileSwitch.ps1
      - name: Build native binary
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [[ "${{ runner.os }}" == Windows ]]; then ext=.exe; fi
          go build -trimpath -o "codexify-go${ext}" ./cmd/codexify-go
          "./codexify-go${ext}" version
      - name: Isolated Setup v3 compiled binary smoke
        if: runner.os == 'Windows'
        shell: bash
        run: go run ./tools/forensics/setup-smoke "./codexify-go.exe"
      - name: Isolated Project Groups compiled-worker restart smoke
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [[ "${{ runner.os }}" == Windows ]]; then ext=.exe; fi
          go run ./tools/forensics/project-groups-smoke "./codexify-go${ext}"

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 ./...

  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-build
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [[ "${{ matrix.goos }}" == windows ]]; then ext=.exe; fi
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -o "codexify-go${ext}" ./cmd/codexify-go

  required:
    name: required
    if: always()
    needs: [test, race, cross-build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          RACE_RESULT: ${{ needs.race.result }}
          CROSS_BUILD_RESULT: ${{ needs.cross-build.result }}
        run: |
          set -euo pipefail
          [[ "$TEST_RESULT" == success ]]
          [[ "$RACE_RESULT" == success ]]
          [[ "$CROSS_BUILD_RESULT" == success ]]
